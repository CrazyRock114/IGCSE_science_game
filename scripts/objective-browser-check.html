<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FIELDWORK objective browser verification</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #0b0f19; color: #e7f4ff; }
    main { width: min(1000px, 95%); margin: 28px auto; }
    button { padding: 9px 14px; font: inherit; border-radius: 7px; cursor: pointer; }
    iframe { width: 100%; height: 420px; border: 1px solid #435a73; border-radius: 7px; margin-block: 12px; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Objective browser verification</h1>
    <p>Runs every objective through the game’s controls and checks the WebGL scene and saved evidence.</p>
    <button id="start">Verify all objective experiments</button>
    <p id="summary" role="status">Ready.</p>
    <pre id="results"></pre>
    <div id="test-host"></div>
  </main>
  <script type="module" src="/__qa/objectives.js"></script>
</body>
</html>
